name: bot

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: wa-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 295
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract session
        run: |
          if [ -f "session.tar.gz" ]; then
            tar -xzf session.tar.gz
            echo "=== files count ==="
            ls auth_info_baileys/ | wc -l
            echo "=== first files ==="
            ls auth_info_baileys/ | head -5
          else
            echo "no session file"
            exit 1
          fi

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Run
        env:
          ADMIN_NUMBER: ${{ secrets.ADMIN_NUMBER }}
          API_EXTRACT: ${{ secrets.API_EXTRACT }}
          API_HEALTH: ${{ secrets.API_HEALTH }}
          PREFIX: ${{ secrets.PREFIX }}
          BOT_NAME: ${{ secrets.BOT_NAME }}
        run: timeout 16500 node bot.js || true

      - name: Persist session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -d "auth_info_baileys" ]; then
            tar -czf session.tar.gz auth_info_baileys
            git config user.name "wa-bot"
            git config user.email "wa-bot@users.noreply.github.com"
            git add -f session.tar.gz
            if ! git diff --cached --quiet; then
              git commit -m "session $(date +%s)"
              git pull --rebase origin "${GITHUB_REF_NAME}" || true
              git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
              git push origin "HEAD:${GITHUB_REF_NAME}" || true
            fi
          fi
